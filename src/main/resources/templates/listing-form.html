<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новое объявление</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header(${email})}"></header>
<main class="narrow">
    <h1>Новое объявление</h1>
    <form th:action="@{/my/listings}" method="post">
        <label>Тип</label>
        <select name="type" required>
            <option value="SELL">Продаю</option>
            <option value="WANT">Ищу</option>
        </select>
        <label>Название запчасти</label>
        <input type="text" name="title" required>
        <label>Номер детали (если знаете)</label>
        <input type="text" name="partNumber">
        <label>Автомобиль (марка, модель, год)</label>
        <input type="text" name="carInfo">
        <label>Цена, ₽ (необязательно)</label>
        <input type="number" name="price" min="0">
        <label>Город</label>
        <input type="text" name="city">
        <label>Описание</label>
        <textarea name="description" rows="4" maxlength="2000"></textarea>
        <button type="submit">Опубликовать</button>
    </form>
</main>
</body>
</html>
