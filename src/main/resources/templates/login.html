<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><a class="logo" th:href="@{/}">Автозапчасти</a></header>
<main class="narrow">
    <h1>Вход</h1>
    <p class="ok" th:if="${param.registered}">Регистрация прошла успешно. Войдите в аккаунт.</p>
    <p class="error" th:if="${param.error}">Неверный email или пароль.</p>
    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="username" required>
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</main>
</body>
</html>
