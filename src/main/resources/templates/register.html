<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><a class="logo" th:href="@{/}">Автозапчасти</a></header>
<main class="narrow">
    <h1>Регистрация</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" method="post">
        <label>Имя</label>
        <input type="text" name="name" th:value="${name}" required>
        <label>Email</label>
        <input type="email" name="email" th:value="${email}" required>
        <label>Пароль (не короче 6 символов)</label>
        <input type="password" name="password" minlength="6" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</main>
</body>
</html>
