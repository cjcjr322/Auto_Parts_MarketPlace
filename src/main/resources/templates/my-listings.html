<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои объявления</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header(${email})}"></header>
<main>
    <h1>Мои объявления</h1>
    <p><a class="button" th:href="@{/my/listings/new}">Добавить объявление</a></p>
    <p th:if="${items.isEmpty()}">У вас пока нет объявлений.</p>
    <div class="card" th:each="l : ${items}">
        <span class="badge" th:text="${l.type.label}"></span>
        <h3><a th:href="@{/listing/{id}(id=${l.id})}" th:text="${l.title}"></a></h3>
        <p th:text="${l.carInfo}"></p>
        <form th:action="@{/my/listings/{id}/delete(id=${l.id})}" method="post"
              onsubmit="return confirm('Удалить объявление?');">
            <button type="submit">Удалить</button>
        </form>
    </div>
</main>
</body>
</html>
