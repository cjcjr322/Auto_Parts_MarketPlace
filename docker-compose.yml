services:
  db:
    image: postgres:16
    container_name: autoparts-db
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: autoparts
      POSTGRES_PASSWORD: autoparts_pass
    ports:
      - "5432:5432"
    volumes:
      - autoparts-data:/var/lib/postgresql/data

volumes:
  autoparts-data: