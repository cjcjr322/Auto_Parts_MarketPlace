services:
  db:
    image: postgres:16
    container_name: autoparts-db
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: autoparts
      POSTGRES_PASSWORD: autoparts_pass
    ports:
      - "5432:5432"
    volumes:
      - autoparts-data:/var/lib/postgresql/data

  mail:
    image: axllent/mailpit
    container_name: autoparts-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  autoparts-data: